# Translucent field with a red ring: dark red (window border) when idle,
# TrackPoint red while typing/authenticating, light red on a wrong password.
background       = "#050709"
background-alpha = 0.66
text             = "#ffffff"
placeholder      = "#b3b3b3"
text-error       = "#fa4d56"
border           = "#8b0000"
border-active    = "#da1e28"
border-error     = "#fa4d56"
border-alpha     = 1.0
selection        = "#da1e28"
selection-alpha  = 0.45
