# Omarchy IBM theme for tmux. Omarchy does not read this file itself; source it
# from ~/.config/tmux/tmux.conf after your own styling:
#
#   source-file -q ~/.local/state/omarchy/current/theme/tmux.conf
#
# and re-source tmux.conf from a theme-set hook so switching themes restyles
# running sessions.

set -g status-style "bg=#050709,fg=#ffffff"
set -g status-left "#[fg=#050709,bg=#d24646,bold] #S #[bg=#050709] "
set -g status-right "#[fg=#b4b47b]#{?pane_in_mode,COPY ,}#[fg=#8686ba]#{?client_prefix,PREFIX ,}#[fg=#4a4a4a]#h "
set -g window-status-format "#[fg=#8c8c8c] #I:#W "
set -g window-status-current-format "#[fg=#d24646,bold] #I:#W "
set -g window-status-activity-style "fg=#b4b47b"
set -g window-status-bell-style "fg=#d24646,bold"
set -g pane-border-style "fg=#26292e"
set -g pane-active-border-style "fg=#8b0000"
set -g display-panes-colour "#4a4a4a"
set -g display-panes-active-colour "#d24646"
set -g message-style "bg=#050709,fg=#d24646"
set -g message-command-style "bg=#050709,fg=#8686ba"
set -g mode-style "bg=#727272,fg=#050709"
set -g copy-mode-match-style "bg=#b4b47b,fg=#050709"
set -g copy-mode-current-match-style "bg=#d24646,fg=#050709"
set -g popup-border-style "fg=#8686ba"
setw -g clock-mode-colour "#d24646"
