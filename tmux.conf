# Omarchy IBM theme for tmux. Omarchy does not read this file itself; setup.sh
# sources it from ~/.config/tmux/tmux.conf and installs hooks/tmux-theme.sh,
# which restyles running sessions on every theme switch.

set -g status-style "bg=#050709,fg=#ffffff"
set -g status-left "#[fg=#050709,bg=#da1e28,bold] #S #[bg=#050709] "
set -g status-right "#[fg=#b4b47b]#{?pane_in_mode,COPY ,}#[fg=#8686ba]#{?client_prefix,PREFIX ,}#[fg=#4a4a4a]#h "
set -g window-status-format "#[fg=#8c8c8c] #I:#W "
set -g window-status-current-format "#[fg=#da1e28,bold] #I:#W "
set -g window-status-activity-style "fg=#b4b47b"
set -g window-status-bell-style "fg=#da1e28,bold"
set -g pane-border-style "fg=#26292e"
set -g pane-active-border-style "fg=#8b0000"
set -g display-panes-colour "#4a4a4a"
set -g display-panes-active-colour "#da1e28"
set -g message-style "bg=#050709,fg=#da1e28"
set -g message-command-style "bg=#050709,fg=#8686ba"
set -g mode-style "bg=#727272,fg=#050709"
set -g copy-mode-match-style "bg=#b4b47b,fg=#050709"
set -g copy-mode-current-match-style "bg=#da1e28,fg=#050709"
set -g popup-border-style "fg=#8686ba"
setw -g clock-mode-colour "#da1e28"
